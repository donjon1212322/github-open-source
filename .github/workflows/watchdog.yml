name: Watchdog

# GitHub delayed/dropped 34 of 42 schedule events on 2026-11-05. This
# off-minute hourly check notices a missed slot and dispatches it once.
on:
  schedule:
    - cron: "27 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Load state from state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/state_branch.py read
      - name: Check missed slots
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP_ENV: ${{ vars.APP_ENV }}
          PUBLISH_TARGET: ${{ vars.PUBLISH_TARGET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ vars.TELEGRAM_OWNER_CHAT_ID }}
        run: ghos-v6 watchdog
      - name: Commit watchdog markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/state_branch.py write --source state
