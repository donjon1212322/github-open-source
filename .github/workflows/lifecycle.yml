name: Lifecycle guard

# Weekly, non-publishing health check. It watches the failure modes that would
# otherwise stop the bot silently: a state file that outgrows GitHub's 100 MB
# file limit, a stale state branch (heartbeat), live state leaking back into
# main, a repository that goes quiet for 60 days (GitHub disables scheduled
# workflows), and a Gemini model that Google retires.
#
# On the first Monday of the month it also squashes the orphan `state` branch
# into one parentless commit. This keeps that branch's history bounded forever.
on:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Squash must not race a state writer. Both workflows share this group.
concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: State branch heartbeat
        id: state_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/state_branch.py status > state-status.json || true
          cat state-status.json
      - name: Check state branch health, repository activity and model lifecycle
        id: guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          problems = []
          try:
              with open("state-status.json", encoding="utf-8") as fh:
                  report = json.load(fh)
          except (OSError, ValueError):
              report = {}
          if not report:
              problems.append("state branch status unavailable")
          else:
              print("state branch:", json.dumps(report, ensure_ascii=False))
              if not report.get("exists"):
                  problems.append("state branch is missing; run tools/state_branch.py init")
              problems.extend(f"state: {p}" for p in report.get("problems", []))
              age = report.get("age_days", 0)
              if isinstance(age, (int, float)) and age > 45:
                  problems.append(
                      f"no repository activity for {age:.0f} days; GitHub disables "
                      "scheduled workflows after 60 days"
                  )

          key = os.environ.get("GEMINI_API_KEY", "")
          model = (os.environ.get("GEMINI_MODEL") or "gemini-3.5-flash-lite").strip()
          if key:
              try:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models?key={key}"
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response)
                  names = {
                      str(item.get("name", "")).removeprefix("models/")
                      for item in data.get("models", [])
                  }
                  if model not in names:
                      problems.append(
                          f"GEMINI_MODEL={model} is not listed by the API; update the "
                          "Variable before the model is retired"
                      )
                  else:
                      print(f"model {model}: available")
              except Exception as exc:  # noqa: BLE001
                  problems.append(f"could not verify the Gemini model list ({type(exc).__name__})")
          else:
              print("GEMINI_API_KEY not set; model check skipped")

          # The first Monday of the month always falls on day 1..7.
          squash = "true" if datetime.datetime.now(datetime.timezone.utc).day <= 7 else "false"
          print("monthly squash:", squash)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("problems<<EOF\n")
              fh.write("\n".join(f"- {p}" for p in problems) + "\n")
              fh.write("EOF\n")
              fh.write(f"alert={'true' if problems else 'false'}\n")
              fh.write(f"squash={squash}\n")
          for problem in problems:
              print("ALERT:", problem)
          PY
      - name: Monthly state branch squash
        if: steps.guard.outputs.squash == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/state_branch.py squash
      - name: Open a tracking issue
        if: steps.guard.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ steps.guard.outputs.problems }}
        run: |
          TITLE="Lifecycle guard: action needed"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "issue #$EXISTING is already open"
          else
            printf 'Automated weekly guard found:\n\n%s\n\nSee docs/RUNBOOK.md.\n' "$PROBLEMS" \
              | gh issue create --title "$TITLE" --body-file -
          fi
