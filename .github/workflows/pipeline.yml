name: Publishing pipeline

on:
  workflow_dispatch:
    inputs:
      command:
        description: Pipeline command
        type: choice
        default: collect
        options:
          - collect
          - publish
          - crossposts
          - article
          - article-update
          - article-unseries
          - devto-remove
          - news
          - news-article
          - quality-fix
          - brief-dedup-fix
          - digest
          - digest-card-fix
          - poll-preview
          - poll-replace
          - report
          - moderation
          - facebook-handoff
          - metrics
          - learn
          - poll-close
      slot:
        description: Publish slot label (publish command only)
        type: string
        default: manual
      force_news:
        description: Run AI Brief even if its feature flag is off (news command only)
        type: boolean
        default: false
      refresh_news:
        description: Regenerate the newest AI Brief and edit its existing post in place
        type: boolean
        default: false
      article_ids:
        description: Comma-separated dev.to ids for article-unseries / devto-remove
        type: string
        default: ""
  schedule:
    # Three posts a day (owner decision, 2026-11-01).
    # Off-minute crons: GitHub delays/drops schedules at :00/:15/:30/:45.
    - cron: "23 4 * * *"     # collect
    - cron: "13 7 * * *"     # publish · Europe morning
    - cron: "43 12 * * *"    # publish · Europe midday
    - cron: "18 17 * * *"    # publish · US peak
    # Weekly cycle: digest + poll on Sunday, close + learn on Thursday.
    - cron: "13 16 * * 0"    # Sunday digest + week poll
    - cron: "53 18 * * 4"    # close poll, update value model (after crossposts/handoff)
    - cron: "23 20 * * *"    # daily views snapshot
    - cron: "43 16 * * 0"    # weekly owner report
    # Continuous housekeeping.
    - cron: "17 0,18,19,20,21,22,23 * * *"   # crossposts: 7 checks after the last project slot (was 48/day)
    - cron: "33 13 * * *"    # article of the day
    - cron: "18 19 * * *"    # AI Brief · daily, after the last project slot
    - cron: "53 19 * * *"    # second dev.to article from the AI Brief
    - cron: "47 */3 * * *"   # moderation · every 3h
    - cron: "23 18 * * *"    # Facebook handoff (make.com), after the last project slot

permissions:
  contents: read

concurrency:
  group: state-writer
  cancel-in-progress: false
  # Keep every pending run. With the default `single` queue a newer scheduled
  # run cancelled the watchdog's dispatch before it ever got a job (05.11).
  queue: max

jobs:
  # Runs the project code with the secrets it needs. It cannot write to the
  # repository: the token is read-only and checkout credentials are not
  # persisted. The resulting state is handed to the next job as an artifact.
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_ENV: ${{ vars.APP_ENV }}
      PUBLISH_TARGET: ${{ vars.PUBLISH_TARGET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TEST_CHANNEL_ID: ${{ vars.TELEGRAM_TEST_CHANNEL_ID }}
      TELEGRAM_MAIN_CHANNEL_ID: ${{ vars.TELEGRAM_MAIN_CHANNEL_ID }}
      # Legacy name kept as a fallback for older setups; config.py reads both.
      MAIN_TELEGRAM_CHANNEL: ${{ vars.MAIN_TELEGRAM_CHANNEL }}
      TELEGRAM_OWNER_CHAT_ID: ${{ vars.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_SOURCE_CHANNELS: ${{ vars.TELEGRAM_SOURCE_CHANNELS }}
      GH_API_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
      DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      FEATURE_TELEGRAPH: ${{ vars.FEATURE_TELEGRAPH }}
      FEATURE_DEVTO: ${{ vars.FEATURE_DEVTO }}
      FEATURE_BLUESKY: ${{ vars.FEATURE_BLUESKY }}
      FEATURE_AI_BRIEF: ${{ vars.FEATURE_AI_BRIEF }}
      # Owner 11.11: explicit rollback switch (default true in config.py).
      FEATURE_TELEGRAM_DISCOVERY: ${{ vars.FEATURE_TELEGRAM_DISCOVERY }}
      FEATURE_SHEETS_HANDOFF: ${{ vars.FEATURE_SHEETS_HANDOFF }}
      FACEBOOK_SHEETS_ID: ${{ vars.FACEBOOK_SHEETS_ID }}
      FACEBOOK_SHEETS_RANGE: ${{ vars.FACEBOOK_SHEETS_RANGE }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      # A queued run must see the state the previous run committed. The live
      # state lives on the orphan `state` branch; main is a shallow,
      # code-only checkout that is never rewritten at runtime.
      - name: Load state from state branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/state_branch.py read
      - name: State digest baseline
        id: state_baseline
        run: echo "digest=$(python tools/state_branch.py digest)" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Run pipeline command
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          SLOT: ${{ inputs.slot }}
          FORCE_NEWS: ${{ inputs.force_news }}
          REFRESH_NEWS: ${{ inputs.refresh_news }}
          ARTICLE_IDS: ${{ inputs.article_ids }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$COMMAND" in
              collect|publish|crossposts|article|article-update|article-unseries|devto-remove|news|news-article|quality-fix|brief-dedup-fix|digest|digest-card-fix|poll-preview|poll-replace|report|moderation|facebook-handoff|metrics|learn|poll-close) ;;
              *) echo "::error::invalid command: $COMMAND"; exit 1 ;;
            esac
            if [[ "$COMMAND" == "publish" ]]; then
              if [[ ! "$SLOT" =~ ^[A-Za-z0-9_-]{1,40}$ ]]; then
                echo "::error::invalid slot: $SLOT"
                exit 1
              fi
              ghos-v6 publish --slot "$SLOT"
            elif [[ "$COMMAND" == "article-unseries" ]]; then
              if [[ ! "$ARTICLE_IDS" =~ ^[0-9,[:space:]]{0,200}$ ]]; then
                echo "::error::invalid article ids: $ARTICLE_IDS"; exit 1
              fi
              ghos-v6 article-unseries --ids "$ARTICLE_IDS"
            elif [[ "$COMMAND" == "devto-remove" ]]; then
              if [[ ! "$ARTICLE_IDS" =~ ^[0-9,[:space:]]{1,200}$ ]]; then
                echo "::error::invalid article ids: $ARTICLE_IDS"; exit 1
              fi
              ghos-v6 devto-remove --ids "$ARTICLE_IDS"
            elif [[ "$COMMAND" == "news" ]]; then
              news_flags=()
              if [[ "$FORCE_NEWS" == "true" ]]; then news_flags+=(--force); fi
              if [[ "$REFRESH_NEWS" == "true" ]]; then news_flags+=(--refresh); fi
              ghos-v6 news "${news_flags[@]}"
            else
              ghos-v6 "$COMMAND"
            fi
          else
            ghos-v6 scheduled --schedule "$SCHEDULE"
          fi
      - name: Detect state change
        id: state_change
        if: always()
        run: |
          now=$(python tools/state_branch.py digest)
          before="${{ steps.state_baseline.outputs.digest }}"
          if [[ "$now" != "$before" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload state
        if: ${{ always() && steps.state_change.outputs.changed == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: state
          path: state/
          retention-days: 1
          if-no-files-found: warn

  # Commits the state. This job has write access, but it does not run project
  # code and it does not receive any publishing secret. One atomic CAS
  # commit goes to the orphan `state` branch; main is never touched.
  commit-state:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download state artifact
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: state
          path: state-new
      - name: Commit state to the state branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/state_branch.py write --from state-new
